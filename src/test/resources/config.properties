# Framework settings. Any key can be overridden on the command line, e.g.
#   ./mvnw test -Dheadless=true -Dplatform=IOS_SAFARI_EMULATION

base.url=https://marketplace-uat.bimasugam.co.in/

# Used when the suite file does not set a "platform" parameter.
# ANDROID_CHROME_EMULATION | IOS_SAFARI_EMULATION | ANDROID_CHROME_DEVICE | BROWSERSTACK_ANDROID
platform=ANDROID_CHROME_EMULATION

# BROWSERSTACK_ANDROID: real Chrome on a BrowserStack Android phone; needs the browserstack Maven profile (see pom.xml)
# and BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY in the environment - never put credentials in this file
browserstack.device=Google Pixel 9
browserstack.build=Bima Sugam PWA

# ANDROID_CHROME_DEVICE: real Chrome on an Android emulator or USB phone, via adb
adb.path=/opt/homebrew/bin/adb
# "auto" = the only connected device; otherwise a serial from `adb devices`, e.g. emulator-5554
android.serial=auto
# Local port Chrome's DevTools socket is forwarded to
android.cdp.port=9222

# false = browser windows are visible while tests run; use -Dheadless=true on Jenkins/CI
headless=false

# Default wait for any element or action
timeout.ms=15000
# First load downloads ~10 MB of Flutter code and fonts, so allow longer for app start
app.start.timeout.ms=30000
# UAT sometimes never answers a font request and the app hangs on its splash
# screen; reload this many times in total before failing (logged as a WARN)
app.start.attempts=2

# Unchanging app files served from memory after their first download in a run
# (keeps request volume low enough not to trip the site's firewall)
static.file.patterns=**/assets/**, **/canvaskit/**, **/main.dart.js, https://cms-bucket-uat.bimasugam.co.in/**

# Screenshots and Playwright traces of failed tests
artifacts.dir=test-output/failures

# Video of every test (passed or failed) as proof: <video.dir>/<PLATFORM>/<TestClass>.<test>.webm
# Not available for ANDROID_CHROME_DEVICE (real Chrome on a device cannot be recorded by Playwright)
video.enabled=true
video.dir=test-output/videos

# OTP login (UAT texts a new OTP on every login): the test waits for the tester to
# write the OTP into otp.file. Accounts: testdata/test-accounts.csv, least recently used first.
otp.file=test-output/otp.txt
otp.wait.seconds=300
account.usage.file=test-output/account-usage.properties
# Logged-in state saved per platform and reused (one OTP per platform) while younger than this
session.dir=test-output/sessions
session.max.age.minutes=120

# HTML report (one per run, start time added to the name): per test steps, duration, result,
# failure screenshot and app performance
report.file=test-output/report/PWA-Test-Report.html
